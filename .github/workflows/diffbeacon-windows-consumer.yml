name: DiffBeacon released Action on Windows (different repository)

on:
  pull_request:

permissions:
  contents: read

jobs:
  consumer-review:
    name: windows-latest / pinned v0.1.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history, no credentials persisted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the pinned published Action from another repository
        uses: Pavithran-R-A/DiffBeacon@a89d8bb7d048bfd4e016e494428d04f060e82112 # v0.1.1

      - name: Echo the Job Summary the Action produced (evidence into the run log)
        shell: pwsh
        run: |
          Write-Output "GITHUB_STEP_SUMMARY=$env:GITHUB_STEP_SUMMARY"
          Get-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Raw
